spring.application.name=kanban_db

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/kanban_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Autoriser les virgules trailing dans le JSON
spring.jackson.parser.allow-trailing-comma=true

# Configuration Swagger avec context-path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/v3/api-docs

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=${SERVER_PORT:8084}

# JWT Secret Key (use a strong, long, random string in production)
jwt.secret=${JWT_SECRET}

# Access Token Expiration (15 minutes = 900000 ms)
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:3600000}

# Refresh Token Expiration (7 days = 604800000 ms)
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4202,http://localhost:8081}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ========================================
# SWAGGER / SPRINGDOC CONFIGURATION
# ========================================

# Enable/disable Swagger UI based on profile
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Swagger UI customization
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Display request duration in Swagger UI
springdoc.swagger-ui.displayRequestDuration=true

# Show all HTTP methods
springdoc.swagger-ui.supportedSubmitMethods=get,put,post,delete,options,head,patch

# Package to scan for API documentation
springdoc.packages-to-scan=com.kanban.kanbanapp.controller

# ========================================
# PROFILS SPRING (dev/prod)
# ========================================
# Par défaut: mode développement (Swagger activé)
# Pour désactiver en production: --spring.profiles.active=prod