spring.application.name=tododb

# Database Configuration

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/tododb}
spring.datasource.username=${DB_USERNAME:appTodo}
spring.datasource.password=${DB_PASSWORD:a20lFZZr6clAhxwO}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Autoriser les virgules trailing dans le JSON
spring.jackson.parser.allow-trailing-comma=true

# Configuration Swagger avec context-path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/v3/api-docs

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=${SERVER_PORT:8081}

# JWT Secret Key (use a strong, long, random string in production)
jwt.secret=${JWT_SECRET}

# Access Token Expiration (15 minutes = 900000 ms)
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:900000}

# Refresh Token Expiration (7 days = 604800000 ms)
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600